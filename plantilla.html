<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<meta property="og:type" content="website">
<meta property="og:title" content="__TITULO__">
<meta property="og:description" content="__FECHA_LARGA__ · Toca para ver cuánto falta">
<meta property="og:image" content="__IMAGEN__">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="__URL__">
<meta name="theme-color" content="#4a1410">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;text-align:center;color:#fff3e0;overflow-x:hidden;
    font-family:Georgia,"Times New Roman",serif;
    background:radial-gradient(ellipse at 50% 0%,#a0451c 0%,#5a1a14 45%,#2b0b0a 100%)}
  .hoja{position:fixed;top:-40px;font-size:26px;opacity:.55;animation:cae linear infinite;pointer-events:none}
  @keyframes cae{to{transform:translateY(110vh) rotate(360deg)}}
  svg.copa{width:150px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  h1{margin:8px 0 2px;font-size:clamp(34px,9vw,60px);letter-spacing:.5px;color:#ffd8a8}
  .fecha{margin:0 0 22px;font-size:clamp(16px,4.2vw,22px);color:#f3b88a;font-style:italic}
  .dias{font-size:clamp(96px,30vw,190px);line-height:.95;font-weight:bold;color:#fff;
    text-shadow:0 4px 0 #8a2f14,0 10px 24px rgba(0,0,0,.5)}
  .etq{font-size:clamp(18px,5vw,26px);margin:4px 0 22px;color:#ffd8a8}
  .caja{display:flex;gap:10px;justify-content:center}
  .caja div{min-width:74px;padding:10px 8px;border-radius:14px;
    background:rgba(255,243,224,.1);border:1px solid rgba(255,216,168,.35);backdrop-filter:blur(4px)}
  .caja b{display:block;font-size:clamp(26px,7vw,36px);font-variant-numeric:tabular-nums}
  .caja span{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#f3b88a}
  .fin{font-size:clamp(34px,9vw,56px);font-weight:bold;color:#ffd8a8;margin:10px 0}
  .pie{margin-top:30px;font-size:14px;color:#c98a63}
  body>*:not(.hoja){position:relative;z-index:1}
  [hidden]{display:none!important}
</style>
</head>
<body>
<svg class="copa" viewBox="0 0 200 230" aria-hidden="true">
  <defs>
    <linearGradient id="lq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2481f"/><stop offset="1" stop-color="#7a1f10"/>
    </linearGradient>
  </defs>
  <!-- pincho con aceituna -->
  <line x1="150" y1="10" x2="112" y2="110" stroke="#d9c7a0" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="128" cy="70" rx="15" ry="11" fill="#7c8f2c" transform="rotate(-22 128 70)"/>
  <circle cx="132" cy="68" r="4.5" fill="#c0392b"/>
  <!-- vaso -->
  <path d="M40 80 L160 80 L150 205 Q149 215 139 215 L61 215 Q51 215 50 205 Z" fill="rgba(255,243,224,.14)" stroke="#ffe4c4" stroke-width="3"/>
  <path d="M44 112 L156 112 L149 204 Q148 211 140 211 L60 211 Q52 211 51 204 Z" fill="url(#lq)"/>
  <rect x="68" y="124" width="36" height="36" rx="7" fill="rgba(255,255,255,.28)" transform="rotate(-8 86 142)"/>
  <rect x="108" y="146" width="32" height="32" rx="7" fill="rgba(255,255,255,.22)" transform="rotate(10 124 162)"/>
  <!-- rodaja de naranja -->
  <g transform="translate(158 82)">
    <circle r="26" fill="#f28c1e" stroke="#ffb454" stroke-width="4"/>
    <g stroke="#ffe0a8" stroke-width="2.2"><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-19" y1="-11" x2="19" y2="11"/><line x1="-19" y1="11" x2="19" y2="-11"/></g>
  </g>
</svg>

<h1>__TITULO__</h1>
<p class="fecha">__FECHA_LARGA__ · __HORA__ h</p>

<main id="cuenta">
  <div class="dias" id="d">__DIAS__</div>
  <div class="etq" id="etq">__ETQ__</div>
  <div class="caja">
    <div><b id="h">--</b><span>horas</span></div>
    <div><b id="m">--</b><span>min</span></div>
    <div><b id="s">--</b><span>seg</span></div>
  </div>
</main>
<div class="fin" id="fin" hidden></div>
<p class="pie">¡Nos vemos allí! 🥂</p>

<script>
(function(){
  var meta = new Date("__OBJETIVO__").getTime();
  var $ = function(i){return document.getElementById(i)};
  var cero = function(n){return (n<10?"0":"")+n};
  function tick(){
    var ms = meta - Date.now();
    if (ms <= 0){
      $("cuenta").hidden = true; $("fin").hidden = false;
      $("fin").textContent = (-ms < 864e5) ? "¡Ya es la hora! 🥂" : "Ya pasó. ¡Hasta el próximo!";
      return;
    }
    var t = Math.floor(ms/1000);
    var d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
    $("d").textContent = d;
    $("etq").textContent = (d===1 ? "día" : "días") + " para brindar";
    $("h").textContent = cero(h); $("m").textContent = cero(m); $("s").textContent = cero(s);
  }
  tick(); setInterval(tick, 1000);
  var hojas = ["🍂","🍁","🍂"];
  for (var i=0;i<12;i++){
    var e = document.createElement("div"); e.className = "hoja"; e.textContent = hojas[i%3];
    e.style.left = (Math.random()*100)+"vw";
    e.style.animationDuration = (9+Math.random()*10)+"s";
    e.style.animationDelay = (-Math.random()*15)+"s";
    e.style.fontSize = (18+Math.random()*16)+"px";
    document.body.appendChild(e);
  }
})();
</script>
</body>
</html>
